[build-system]
requires = ["setuptools>=77", "Cython>=3.1", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "waterz"
dynamic = ["version"]
description = "Simple watershed and agglomeration for affinity graphs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jan Funke" }, { name = "Jingpeng Wu" }]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Operating System :: OS Independent",
	"Typing :: Typed",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# to compile scoring functions that are not precompiled
jit = ["witty[cython]>=0.3.3"]

[project.urls]
Homepage = "https://github.com/funkey/waterz"
Repository = "https://github.com/funkey/waterz"
Issues = "https://github.com/funkey/waterz/issues"

[dependency-groups]
test = ["pytest", "pytest-cov"]
dev = [
	{ include-group = "test" },
	"waterz[jit]",
	"coveralls",
	"pre-commit",
	"ruff",
	"ipython>=8.18.1",
	"Cython>=3.1",
	"setuptools",
]

[tool.uv.sources]
waterz = { workspace = true }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waterz = ["*.pyx", "*.pyi", "*.h", "frontend_*.cpp", "backend/*.hpp", "py.typed"]


[tool.cibuildwheel]
# a single abi3 build per platform covers every supported CPython
build = "cp311-*"
skip = ["*-musllinux_*", "*-win32", "*_i686"]
test-groups = ["test"]
# witty is not installed: nothing that is tested here needs a compiler
test-command = "pytest {project}/tests -q"
# never let a wheel silently ship without the precompiled variants
test-environment = { WATERZ_REQUIRE_PREBUILT = "1" }

[tool.cibuildwheel.linux]
before-all = "dnf install -y boost-devel"

[tool.cibuildwheel.macos]
before-all = "brew install boost"

[tool.cibuildwheel.windows]
before-all = "vcpkg install boost-multi-array:x64-windows"
environment = { BOOST_ROOT = "$VCPKG_INSTALLATION_ROOT/installed/x64-windows" }

# https://docs.astral.sh/ruff/
[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]
fix = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
	"E",    # style errors
	"F",    # flakes
	"W",    # warnings
	"I",    # isort
	"UP",   # pyupgrade
	"S",    # bandit
	"C4",   # flake8-comprehensions
	"B",    # flake8-bugbear
	"A001", # flake8-builtins
	"TC",   # flake8-typecheck
	"TID",  # flake8-tidy-imports
	"RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S", "RUF012"]
